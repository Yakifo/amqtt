version: 2

build:
  os: "ubuntu-24.04"
  tools:
    python: "3.13"
  apt_packages:
    - libldap2-dev
    - libsasl2-dev
  jobs:
    pre_install:
      - pip install --upgrade pip
      - pip install uv
      - uv venv
      - uv pip install --group dev --group docs ".[contrib]"
    build:
      post_install:
        # Force-upgrade typing_extensions to bypass the stale cached environment
        - VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH python -m pip install --upgrade typing_extensions
      html:
        - uv run python -m mkdocs build --clean --site-dir $READTHEDOCS_OUTPUT/html --config-file mkdocs.rtd.yml

mkdocs:
  configuration: mkdocs.rtd.yml
